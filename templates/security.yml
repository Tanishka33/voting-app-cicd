- stage: SecurityScan

  displayName: "Build + Security"

  dependsOn: CodeQuality

  jobs:

# ----------------------------------------
# BUILD + SCAN
# ----------------------------------------

  - job: BuildAndScan

    displayName: "Build And Scan"

    pool:
      name: laptop-agent

    steps:

    - checkout: self

    - script: |

        docker build -t vote:test ./vote

        docker build -t result:test ./result

        docker build -t worker:test ./worker

      displayName: "Build Images"

    - script: |

        docker images

      displayName: "Verify Images"

    - script: |

        FAILED=0

        echo "===== VOTE ====="

        trivy image \
        --severity HIGH,CRITICAL \
        --exit-code 1 \
        vote:test || FAILED=1


        echo "===== RESULT ====="

        trivy image \
        --severity HIGH,CRITICAL \
        --exit-code 1 \
        result:test || FAILED=1


        echo "===== WORKER ====="

        trivy image \
        --severity HIGH,CRITICAL \
        --exit-code 1 \
        worker:test || FAILED=1


        echo "##vso[task.setvariable variable=security_failed;isOutput=true]$FAILED"

      displayName: "Security Scan"

      name: trivy



# ----------------------------------------
# APPROVAL
# ----------------------------------------

  - job: SecurityApproval

    displayName: "Security Approval Gate"

    dependsOn: BuildAndScan

    pool: server

    condition: |
      eq(
      dependencies.BuildAndScan.outputs['trivy.security_failed'],
      '1'
      )

    steps:

    - task: ManualValidation@0

      timeoutInMinutes: 60

      inputs:

        notifyUsers: ''

        instructions: |

          HIGH / CRITICAL vulnerabilities detected.

          Approve → Continue

          Reject → Stop

        onTimeout: reject



# ----------------------------------------
# FINALIZE
# ----------------------------------------

  - job: SecurityFinalize

    displayName: "Finalize Security"

    dependsOn:

    - BuildAndScan

    - SecurityApproval

    condition: |
      or(
      succeeded('BuildAndScan'),
      succeeded('SecurityApproval')
      )

    pool:
      name: laptop-agent

    steps:

    - script: |

        echo "Security Stage Completed"

      displayName: "Continue"