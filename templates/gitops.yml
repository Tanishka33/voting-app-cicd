stages:

- stage: GitOpsDeployment

  displayName: "GitOps Deployment"

  dependsOn: KubernetesValidation


  jobs:

  - job: Deploy

    displayName: "Install Argo And Deploy"

    pool:
      name: laptop-agent


    steps:

    - checkout: self


# CONNECT

    - script: |

        export AWS_DEFAULT_REGION=$(AWS_REGION)

        aws eks update-kubeconfig \
          --region $(AWS_REGION) \
          --name $(EKS_CLUSTER)

      displayName: "Connect Cluster"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# INSTALL

    - script: |

        kubectl create namespace argocd \
          --dry-run=client \
          -o yaml \
          | kubectl apply -f -

        kubectl apply \
          --server-side \
          --force-conflicts \
          -n argocd \
          -f \
          https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

      displayName: "Install Argo"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# WAIT

    - script: |

        kubectl rollout status \
        deployment/argocd-server \
        -n argocd \
        --timeout=180s

      displayName: "Wait Argo"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# PASSWORD

    - script: |

        PASS=$(
          kubectl \
          -n argocd \
          get secret \
          argocd-initial-admin-secret \
          -o jsonpath="{.data.password}" \
          | base64 -d
        )

        echo ""
        echo "===================="
        echo "ARGO LOGIN"
        echo "URL: http://localhost:8085"
        echo "USER: admin"
        echo "PASS: $PASS"
        echo "===================="

      displayName: "Show Password"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# CREATE APP

    - script: |

        kubectl apply \
          -f ./gitops/application.yaml

      displayName: "Create Application"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# VERIFY

    - script: |

        sleep 20

        kubectl get applications -n argocd

        kubectl get pods -A

      displayName: "Verify"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# SHOW COMMANDS

    - script: |

        echo ""
        echo "OPEN ARGO:"
        echo "kubectl port-forward svc/argocd-server -n argocd 8085:80"

        echo ""
        echo "OPEN VOTE:"
        echo "kubectl port-forward svc/vote 8090:80"

        echo ""
        echo "OPEN RESULT:"
        echo "kubectl port-forward svc/result 8081:80"

      displayName: "Show Access Commands"