apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:

  name: voting-dev

  namespace: argocd


spec:

  project: default


  source:

    repoURL: https://github.com/Tanishka33/voting-app-cicd.git

    targetRevision: test

    path: k8s-specifications


  destination:

    server: https://kubernetes.default.svc

    namespace: default


  syncPolicy:

    automated:

      prune: true

      selfHeal: true


    syncOptions:

      - CreateNamespace=true