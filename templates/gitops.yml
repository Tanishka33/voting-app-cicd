stages:

- stage: GitOpsDeployment

  displayName: "GitOps Deployment"

  dependsOn: KubernetesValidation


  jobs:

  - job: Deploy

    displayName: "Install Argo And Deploy"

    pool:
      name: laptop-agent


    steps:

    - checkout: self


# CONNECT

    - script: |

        export AWS_DEFAULT_REGION=$(AWS_REGION)

        aws eks update-kubeconfig \
        --region $(AWS_REGION) \
        --name $(EKS_CLUSTER)

      displayName: "Connect Cluster"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# INSTALL

    - script: |

        kubectl create namespace argocd \
        --dry-run=client \
        -o yaml \
        | kubectl apply -f -

        kubectl apply \
          --server-side \
          --force-conflicts \
          -n argocd \
          -f \
          https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

      displayName: "Install Argo"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# EXPOSE UI

    - script: |

        kubectl patch svc argocd-server \
          -n argocd \
          -p '{"spec":{"type":"LoadBalancer"}}'

      displayName: "Expose Argo UI"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# WAIT LB

    - script: |

        echo "Waiting for ELB"

        sleep 40

        kubectl get svc \
        -n argocd

      displayName: "Wait LoadBalancer"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# PASSWORD

    - script: |

        PASS=$(
        kubectl -n argocd \
        get secret \
        argocd-initial-admin-secret \
        -o jsonpath="{.data.password}" \
        | base64 -d
        )

        echo "ARGO PASSWORD:"
        echo $PASS

      displayName: "Show Password"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# APPLICATION

    - script: |

        kubectl apply \
        -f ./gitops/application.yaml

      displayName: "Create Application"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# VERIFY

    - script: |

        sleep 40

        kubectl get applications \
        -n argocd

        kubectl get pods -A

      displayName: "Verify"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)