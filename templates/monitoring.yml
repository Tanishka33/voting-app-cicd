stages:

- stage: Monitoring

  displayName: "Monitoring"

  dependsOn: GitOpsDeployment


  jobs:

  - job: InstallMonitoring

    displayName: "Install Prometheus Grafana"

    pool:
      name: laptop-agent


    steps:

    - checkout: self


# CONNECT

    - script: |

        export AWS_DEFAULT_REGION=$(AWS_REGION)

        aws eks update-kubeconfig \
          --region $(AWS_REGION) \
          --name $(EKS_CLUSTER)

      displayName: "Connect"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# ADD HELM

    - script: |

        helm repo add prometheus-community \
        https://prometheus-community.github.io/helm-charts

        helm repo add grafana \
        https://grafana.github.io/helm-charts

        helm repo update

      displayName: "Prepare Helm"


# INSTALL PROMETHEUS

    - script: |

        helm upgrade \
        --install \
        prometheus \
        prometheus-community/prometheus \
        \
        --namespace monitoring \
        --create-namespace \
        \
        --set alertmanager.enabled=false \
        --set pushgateway.enabled=false

      displayName: "Install Prometheus"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# INSTALL GRAFANA

    - script: |

        helm upgrade \
        --install \
        grafana \
        grafana/grafana \
        \
        --namespace monitoring \
        \
        --set service.type=ClusterIP \
        \
        --set persistence.enabled=false

      displayName: "Install Grafana"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# WAIT

    - script: |

        kubectl wait \
        --for=condition=ready \
        pod \
        -l app.kubernetes.io/name=grafana \
        -n monitoring \
        --timeout=300s

      displayName: "Wait"


# SHOW LOGIN

    - script: |

        PASS=$(
        kubectl get secret \
        -n monitoring \
        grafana \
        -o jsonpath="{.data.admin-password}" \
        | base64 -d
        )

        echo ""
        echo "===================="

        echo "GRAFANA"

        echo ""

        echo "RUN:"

        echo "kubectl port-forward svc/grafana -n monitoring 3000:80"

        echo ""

        echo "URL:"
        echo "http://localhost:3000"

        echo ""

        echo "USER:"
        echo "admin"

        echo ""

        echo "PASS:"
        echo $PASS

        echo ""

        echo "===================="

      displayName: "Show Login"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# VERIFY

    - script: |

        kubectl get pods -n monitoring

      displayName: "Verify"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)