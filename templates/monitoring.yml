stages:
- stage: Monitoring
  displayName: "Monitoring"
  dependsOn: GitOpsDeployment
  jobs:
  - job: InstallMonitoring
    displayName: "Install Prometheus Grafana"
    pool:
      name: laptop-agent
    steps:
    - checkout: self

    # ==========================================
    # 1. CONNECT TO EKS
    # ==========================================
    - script: |
        export AWS_DEFAULT_REGION=$(AWS_REGION)
        aws eks update-kubeconfig \
          --region $(AWS_REGION) \
          --name $(EKS_CLUSTER)
      displayName: "Connect"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

    # ==========================================
    # 2. ADD HELM REPOS
    # ==========================================
    - script: |
        helm repo add prometheus-community \
          https://prometheus-community.github.io/helm-charts
        helm repo add grafana \
          https://grafana.github.io/helm-charts
        helm repo update
      displayName: "Prepare Helm"

    # ==========================================
    # 3. INSTALL PROMETHEUS
    # ==========================================
    - script: |
        helm upgrade \
          --install \
          prometheus \
          prometheus-community/prometheus \
          --namespace monitoring \
          --create-namespace \
          --set alertmanager.enabled=false \
          --set pushgateway.enabled=false
      displayName: "Install Prometheus"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

    # ==========================================
    # 4. INSTALL GRAFANA
    # ==========================================
    - script: |
        helm upgrade \
          --install \
          grafana \
          grafana/grafana \
          --namespace monitoring \
          --set service.type=ClusterIP \
          --set persistence.enabled=false
      displayName: "Install Grafana"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

    # ==========================================
    # 5. WAIT FOR DEPLOYMENT (Updated with Auth)
    # ==========================================
    - script: |
        export AWS_DEFAULT_REGION=$(AWS_REGION)
        aws eks update-kubeconfig \
          --region $(AWS_REGION) \
          --name $(EKS_CLUSTER)

        kubectl wait \
          --for=condition=ready \
          pod \
          -l app.kubernetes.io/name=grafana \
          -n monitoring \
          --timeout=300s
      displayName: "Wait"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

    # ==========================================
    # 6. SHOW LOGIN INFO (Indentation & Auth Fixed)
    # ==========================================
    - script: |
        export AWS_DEFAULT_REGION=$(AWS_REGION)
        aws eks update-kubeconfig \
          --region $(AWS_REGION) \
          --name $(EKS_CLUSTER)

        PASS=$(kubectl get secret \
          -n monitoring \
          grafana \
          -o jsonpath="{.data.admin-password}" \
          | base64 -d)

        echo ""
        echo "===================================================="
        echo "GRAFANA LIVE CREDENTIALS"
        echo "===================================================="
        echo ""
        echo "1. Forward the traffic locally by running:"
        echo "   kubectl port-forward svc/grafana -n monitoring 3000:80"
        echo ""
        echo "2. Open your local browser to:"
        echo "   http://localhost:3000"
        echo ""
        echo "3. Use these authentication details:"
        echo "   USER: admin"
        echo "   PASS: $PASS"
        echo ""
        echo "===================================================="
      displayName: "Show Login"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

    # ==========================================
    # 7. VERIFY ALL MONITORING PODS
    # ==========================================
    - script: |
        export AWS_DEFAULT_REGION=$(AWS_REGION)
        aws eks update-kubeconfig \
          --region $(AWS_REGION) \
          --name $(EKS_CLUSTER)

        kubectl get pods -n monitoring
      displayName: "Verify"
      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)