- stage: PublishImages

  displayName: "Publish Images"

  dependsOn: SecurityScan

  condition: succeeded()

  jobs:

  - job: PushImages

    displayName: "Push Images"

    pool:
      name: laptop-agent

    steps:

    - script: |

        echo $(DOCKER_PASS) | docker login \
        -u $(DOCKER_USER) \
        --password-stdin

      displayName: "Docker Login"

    - script: |

        docker tag vote:test \
        $(DOCKER_USER)/vote:$(Build.BuildId)

        docker tag result:test \
        $(DOCKER_USER)/result:$(Build.BuildId)

        docker tag worker:test \
        $(DOCKER_USER)/worker:$(Build.BuildId)

      displayName: "Tag Images"

    - script: |

        docker push \
        $(DOCKER_USER)/vote:$(Build.BuildId)

        docker push \
        $(DOCKER_USER)/result:$(Build.BuildId)

        docker push \
        $(DOCKER_USER)/worker:$(Build.BuildId)

      displayName: "Push Images"

    - script: |

        docker logout

        docker image prune -af

      condition: always()

      displayName: "Cleanup"