stages:

- stage: KubernetesValidation

  displayName: "Kubernetes Validation"

  dependsOn: TerraformProvision

  jobs:

  - job: ValidateCluster

    displayName: "Validate Kubernetes"

    pool:
      name: laptop-agent

    steps:

    - checkout: self

# STEP 1

    - script: |

        echo "Checking variables"

        if [ -z "$AWS_ACCESS_KEY_ID" ]
        then
          echo "ACCESS_KEY EMPTY"
        else
          echo "ACCESS_KEY PRESENT"
        fi

        if [ -z "$AWS_SECRET_ACCESS_KEY" ]
        then
          echo "SECRET_KEY EMPTY"
          exit 1
        else
          echo "SECRET_KEY PRESENT"
        fi

      displayName: "Check Variables"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

# STEP 2

    - script: |

        export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"

        export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"

        export AWS_DEFAULT_REGION="$(AWS_REGION)"

        aws sts get-caller-identity

      displayName: "Test AWS"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)

# STEP 3

    - script: |

        export AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"

        export AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"

        export AWS_DEFAULT_REGION="$(AWS_REGION)"

        aws eks update-kubeconfig \
        --region $(AWS_REGION) \
        --name $(EKS_CLUSTER)

        kubectl get nodes

      displayName: "Validate Cluster"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)