stages:
- stage: GitOpsDeployment
  displayName: "GitOps Deployment"
  dependsOn: KubernetesValidation
  jobs:
  - job: Deploy
    displayName: "Install Argo And Deploy"
    pool:
      name: laptop-agent
    variables:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: $(AWS_REGION)
    steps:
    - checkout: self

    # CONNECT
    - script: |
        aws eks update-kubeconfig \
          --region $(AWS_REGION) \
          --name $(EKS_CLUSTER)
      displayName: "Connect Cluster"

    # INSTALL ARGO
    - script: |
        kubectl create namespace argocd \
          --dry-run=client \
          -o yaml \
          | kubectl apply -f -

        kubectl apply \
          --server-side \
          --force-conflicts \
          -n argocd \
          -f \
          https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      displayName: "Install Argo"

    # WAIT
    - script: |
        kubectl rollout status \
          deployment/argocd-server \
          -n argocd \
          --timeout=180s
      displayName: "Wait Argo"

    # PASSWORD
    - script: |
        PASS=$(
          kubectl \
            -n argocd \
            get secret \
            argocd-initial-admin-secret \
            -o jsonpath="{.data.password}" \
            | base64 -d
        )

        echo ""
        echo "===================="
        echo "ARGO LOGIN"
        echo ""
        echo "RUN:"
        echo "kubectl port-forward svc/argocd-server -n argocd 8085:80"
        echo ""
        echo "URL:"
        echo "http://localhost:8085"
        echo ""
        echo "USER: admin"
        echo "PASS: $PASS"
        echo "===================="
      displayName: "Show Argo Login"

    # CREATE APP
    - script: |
        kubectl apply \
          -f ./gitops/application.yaml
      displayName: "Create Application"

    # VERIFY
    - script: |
        sleep 15
        kubectl get applications -n argocd
        kubectl get pods -A
      displayName: "Verify"

    # SHOW URL
    - script: |
        NODE=$(kubectl get nodes \
          -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')

        echo ""
        echo "===================="
        echo "APPLICATION URLS"
        echo ""
        echo "VOTE:"
        echo "http://$NODE:31000"
        echo ""
        echo "RESULT:"
        echo "http://$NODE:31001"
        echo ""
        echo "===================="
      displayName: "Show Application URLs"