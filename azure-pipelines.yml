trigger:
  branches:
    include:
      - test

pool:
  name: laptop-agent

variables:
- group: dev-vars

stages:

# ==========================================
# STAGE 1: SOURCE CONTROL VALIDATION
# ==========================================
- stage: SourceValidation
  displayName: "Source Control Validation"
  jobs:
  - job: Validate
    displayName: "Validate Repository"
    steps:
    - checkout: self
    
    - script: |
        echo "Checking branch"
        echo $(Build.SourceBranch)
        if [ "$(Build.SourceBranchName)" != "test" ]
        then
          echo "Only test branch allowed"
          exit 1
        fi
      displayName: "Branch Validation"

    - script: |
        echo "Checking required folders"
        test -d vote
        test -d worker
        test -d result
        test -d terraform
        echo "Structure OK"
      displayName: "Repository Validation"

    - script: |
        git status
        git log --oneline -5
      displayName: "Git Validation"

# ==========================================
# STAGE 2: CODE QUALITY (SONARQUBE)
# ==========================================
- stage: CodeQuality
  displayName: "Code Quality"
  dependsOn: SourceValidation
  jobs:
  - job: SonarScan
    displayName: "Run SonarQube"
    steps:
    - checkout: self
    
    - script: |
        curl $(SONAR_URL)/api/system/status
      displayName: "Check Sonar"

    - script: |
        sonar-scanner \
          -Dsonar.host.url=$(SONAR_URL) \
          -Dsonar.login=$(SONAR_TOKEN)
      displayName: "Run Sonar"

# ==========================================
# STAGE 3: BUILD + SECURITY
# ==========================================
- stage: SecurityScan
  displayName: "Build + Security"
  dependsOn: CodeQuality
  jobs:

  - job: BuildAndScan
    displayName: "Build And Scan"
    steps:
    - checkout: self

    # BUILD
    - script: |
        docker build -t vote:test ./vote
        docker build -t result:test ./result
        docker build -t worker:test ./worker
      displayName: "Build Images"

    # VERIFY
    - script: |
        docker images
      displayName: "Verify Images"

    # TRIVY SCAN
    - script: |
        echo "========== VOTE =========="
        trivy image \
          --exit-code 0 \
          --severity HIGH,CRITICAL \
          vote:test

        echo ""
        echo "========== RESULT =========="
        trivy image \
          --exit-code 0 \
          --severity HIGH,CRITICAL \
          result:test

        echo ""
        echo "========== WORKER =========="
        trivy image \
          --exit-code 0 \
          --severity HIGH,CRITICAL \
          worker:test
      displayName: "Security Scan"

    # CLEANUP
    - script: |
        docker image rm vote:test || true
        docker image rm result:test || true
        docker image rm worker:test || true
        docker image prune -af
      condition: always()
      displayName: "Cleanup"

  # APPROVAL
  - job: SecurityApproval
    displayName: "Security Approval Gate"
    dependsOn: BuildAndScan
    pool: server
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 60
      inputs:
        instructions: |
          Review Trivy output.
          Approve to continue.
        onTimeout: reject