stages:

- stage: Monitoring

  displayName: "Monitoring"

  dependsOn: GitOpsDeployment


  jobs:

  - job: InstallMonitoring

    displayName: "Install Prometheus + Grafana"

    pool:
      name: laptop-agent


    steps:

    - checkout: self


# CONNECT

    - script: |

        export AWS_DEFAULT_REGION=$(AWS_REGION)

        aws eks update-kubeconfig \
          --region $(AWS_REGION) \
          --name $(EKS_CLUSTER)

      displayName: "Connect"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# INSTALL

    - script: |

        helm repo add prometheus-community \
        https://prometheus-community.github.io/helm-charts

        helm repo add grafana \
        https://grafana.github.io/helm-charts

        helm repo update


        helm upgrade \
        --install \
        prometheus \
        prometheus-community/prometheus \
        \
        --namespace monitoring \
        --create-namespace \
        \
        --set server.persistentVolume.enabled=false \
        \
        --set alertmanager.enabled=false \
        \
        --set pushgateway.enabled=false \
        \
        --set kubeStateMetrics.enabled=false \
        \
        --set server.replicaCount=1 \
        \
        --set prometheus-node-exporter.enabled=true


        helm upgrade \
        --install \
        grafana \
        grafana/grafana \
        \
        --namespace monitoring \
        \
        --set replicas=1 \
        \
        --set persistence.enabled=false \
        \
        --set service.type=ClusterIP \
        \
        --set resources.requests.memory=128Mi \
        \
        --set resources.requests.cpu=100m

      displayName: "Install Monitoring"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# WAIT

    - script: |

        export AWS_DEFAULT_REGION=$(AWS_REGION)

        aws eks update-kubeconfig \
          --region $(AWS_REGION) \
          --name $(EKS_CLUSTER)


        kubectl wait \
        --for=condition=ready \
        pod \
        -l app.kubernetes.io/name=grafana \
        -n monitoring \
        --timeout=100s


        kubectl rollout status \
        deployment/prometheus-server \
        -n monitoring \
        --timeout=100s

      displayName: "Wait"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# VERIFY

    - script: |

        kubectl get pods -n monitoring

      displayName: "Verify"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)


# PASSWORD + URL

    - script: |

        PASS=$(
          kubectl \
          get secret \
          -n monitoring \
          grafana \
          -o jsonpath="{.data.admin-password}" \
          | base64 -d
        )


        echo ""

        echo "======================"

        echo "GRAFANA"

        echo ""

        echo "RUN:"

        echo "kubectl port-forward svc/grafana -n monitoring 3000:80"

        echo ""

        echo "URL"

        echo "http://localhost:3000"

        echo ""

        echo "USER"

        echo "admin"

        echo ""

        echo "PASSWORD"

        echo "$PASS"

        echo ""

        echo "PROMETHEUS"

        echo ""

        echo "RUN"

        echo "kubectl port-forward svc/prometheus-server -n monitoring 9090:80"

        echo ""

        echo "URL"

        echo "http://localhost:9090"

        echo ""

        echo "======================"

      displayName: "Show Login"

      env:
        AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
        AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)