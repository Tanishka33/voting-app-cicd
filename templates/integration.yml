stages:

- stage: IntegrationTest

  dependsOn: PublishImages
  jobs:
  - job: Verify

    pool:
      name: laptop-agent

    steps:
    - checkout: self
    - script: |
        docker compose up -d

      displayName: Start

    - script: |
        sleep 45
      displayName: Wait

    - script: |

        curl -f http://localhost:8090

        curl -f http://localhost:8081

      displayName: Test

    - script: |

        docker compose down -v

      condition: always()

      displayName: Cleanup