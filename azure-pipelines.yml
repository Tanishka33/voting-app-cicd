trigger:
  branches:
    include:
      - test

pool:
  name: laptop-agent

variables:
- group: dev-vars

stages:

# ==========================================
# STAGE 1: SOURCE CONTROL VALIDATION
# ==========================================
- stage: SourceValidation
  displayName: "Source Control Validation"
  jobs:
  - job: Validate
    displayName: "Validate Repository"
    steps:
    - checkout: self
    
    - script: |
        echo "Checking branch"
        echo $(Build.SourceBranch)
        if [ "$(Build.SourceBranchName)" != "test" ]
        then
          echo "Only test branch allowed"
          exit 1
        fi
      displayName: "Branch Validation"

    - script: |
        echo "Checking required folders"
        test -d vote
        test -d worker
        test -d result
        test -d terraform
        echo "Structure OK"
      displayName: "Repository Validation"

    - script: |
        git status
        git log --oneline -5
      displayName: "Git Validation"

# ==========================================
# STAGE 2: CODE QUALITY (SONARQUBE)
# ==========================================
- stage: CodeQuality
  displayName: "Code Quality"
  dependsOn: SourceValidation
  jobs:
  - job: SonarScan
    displayName: "Run SonarQube"
    steps:
    - checkout: self
    
    - script: |
        curl $(SONAR_URL)/api/system/status
      displayName: "Check Sonar"

    - script: |
        sonar-scanner \
          -Dsonar.host.url=$(SONAR_URL) \
          -Dsonar.login=$(SONAR_TOKEN)
      displayName: "Run Sonar"

# ==========================================
# STAGE 3: BUILD + SECURITY
# ==========================================
- stage: SecurityScan
  displayName: "Build + Security"
  dependsOn: CodeQuality
  jobs:

  - job: BuildAndScan
    displayName: "Build And Scan"
    steps:
    - checkout: self

    # BUILD
    - script: |
        docker build -t vote:test ./vote
        docker build -t result:test ./result
        docker build -t worker:test ./worker
      displayName: "Build Images"

    # VERIFY
    - script: |
        docker images
      displayName: "Verify Images"

    # SECURITY (TRIVY FAIL DETECTION)
    - script: |
        FAILED=0

        echo "===== VOTE ====="
        trivy image \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          vote:test || FAILED=1

        echo "===== RESULT ====="
        trivy image \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          result:test || FAILED=1

        echo "===== WORKER ====="
        trivy image \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          worker:test || FAILED=1

        if [ "$FAILED" -eq 1 ]
        then
          echo "##vso[task.setvariable variable=security_failed;isOutput=false]true"
          echo "Vulnerabilities detected"
        else
          echo "##vso[task.setvariable variable=security_failed;isOutput=false]false"
          echo "Security Passed"
        fi
      displayName: "Security Scan"

    # CLEANUP
    - script: |
        docker image rm vote:test || true
        docker image rm result:test || true
        docker image rm worker:test || true
        docker image prune -af
      condition: always()
      displayName: "Cleanup"

  # CONDITIONAL APPROVAL GATE
  - job: SecurityApproval
    displayName: "Security Approval Gate"
    dependsOn: BuildAndScan
    condition: always()
    pool: server
    steps:
    - task: ManualValidation@0
      condition: eq(dependencies.BuildAndScan.outputs['BuildAndScan.security_failed'], 'true')
      timeoutInMinutes: 60
      inputs:
        instructions: |
          HIGH/CRITICAL vulnerabilities detected.
          Review logs.
          
          Approve to continue
          Reject to stop
        onTimeout: reject